apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
        - name: rest-server
          image: lab7-rest:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: REDIS_HOST
              value: redis.default.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_QUEUE_KEY
              value: toWorker
            - name: MINIO_ENDPOINT
              value: minio-proj.minio-ns.svc.cluster.local:9000
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_QUEUE_BUCKET
              value: queue
            - name: MINIO_OUTPUT_BUCKET
              value: output
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rest-minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rest-minio-credentials
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: rest-server
  ports:
    - name: http
      port: 5000
      targetPort: http
